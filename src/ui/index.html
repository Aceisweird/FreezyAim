<!doctype html>
<html lang="en" data-look="/*look*/">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freezy Aim</title>
  <meta name="theme-color" content="/*title*/">
  <link rel="icon" href="/icon.png">
  <link rel="preload" href="/fonts/poppins-400.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="/fonts/poppins-500.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="/fonts/poppins-700.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <style id="theme">/*theme*/</style>
</head>
<body>
  <div class="rings" aria-hidden="true"></div>
  <div class="rings small" aria-hidden="true"></div>
  <div class="app">
    <nav class="sidebar" aria-label="Main">
      <span class="indicator" id="indicator" aria-hidden="true"></span>
      <div class="nav-list" id="nav"></div>
    </nav>
    <main id="page" tabindex="-1"></main>
  </div>
  <button class="quit" id="quit" type="button" aria-label="Closes the app" data-tip="Closes the app">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
  </button>
  <div class="drag-strip" id="drag-strip" aria-hidden="true"></div>
  <div class="window-buttons">
    <button class="window-button" id="window-minimize" type="button" aria-label="Minimize"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 12h12" /></svg></button>
    <button class="window-button" id="window-maximize" type="button" aria-label="Maximize"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 7h10v10H7z" /></svg></button>
    <button class="window-button" id="window-close" type="button" aria-label="Close this window and keep the crosshair"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></button>
  </div>
  <button class="home" id="home" type="button" aria-label="Home">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <defs>
        <linearGradient id="home-fill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" />
          <stop offset="1" />
        </linearGradient>
      </defs>
      <path d="M10.7 3.5 3.9 9.4c-.6.5-.9 1.2-.9 2V19a2 2 0 0 0 2 2h3.5v-5.5a1.5 1.5 0 0 1 1.5-1.5h4a1.5 1.5 0 0 1 1.5 1.5V21H19a2 2 0 0 0 2-2v-7.6c0-.8-.3-1.5-.9-2l-6.8-5.9a2 2 0 0 0-2.6 0z" />
    </svg>
  </button>
  <div class="notice" id="notice" role="alert" hidden></div>
  <script src="/motion.js" defer></script>
  <script src="/editor.js" defer></script>
  <script src="/draw.js" defer></script>
  <script src="/settings.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
